name: Demo checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check -w fe
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm exec -w fe -- playwright install --with-deps chromium
      - run: npm run test:e2e
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.5.26
        env:
          MARIADB_ROOT_PASSWORD: integration-only
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      INTEGRATION_DB_HOST: 127.0.0.1
      INTEGRATION_DB_PORT: '3307'
      INTEGRATION_DB_USER: root
      INTEGRATION_DB_PASSWORD: integration-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - run: npm exec -w fe -- playwright install --with-deps chromium
      - run: npm run test:e2e:auth
