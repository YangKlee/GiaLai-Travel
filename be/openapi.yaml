openapi: 3.1.0
info:
  title: GiaLaiTravel API
  version: 0.1.0
  description: Health and public place discovery. Demo server returns dataset=demo
    and never connects to the application database.
servers:
  - url: http://localhost:3000
paths:
  /api/v1/catalog:
    get:
      operationId: getCatalog
      summary: Categories and regions containing published phase-1 places
      responses:
        "200":
          description: Available filters
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - dataset
                properties:
                  dataset:
                    $ref: "#/components/schemas/Dataset"
                  data:
                    type: object
                    required:
                      - categories
                      - regions
                    properties:
                      categories:
                        type: array
                        items:
                          type: object
                          required:
                            - code
                            - name
                          properties:
                            code:
                              $ref: "#/components/schemas/Category"
                            name:
                              type: string
                      regions:
                        type: array
                        items:
                          $ref: "#/components/schemas/Region"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/places:
    get:
      operationId: listPlaces
      summary: Published Vietnamese places; unknown prices excluded when a price
        filter is supplied
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/Category"
        - name: regionId
          in: query
          schema:
            type: string
            format: uuid
        - name: minPrice
          in: query
          schema:
            type: string
            pattern: ^(0|[1-9][0-9]{0,19})$
          description: Integer VND up to unsigned BIGINT; must not exceed maxPrice
        - name: maxPrice
          in: query
          schema:
            type: string
            pattern: ^(0|[1-9][0-9]{0,19})$
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - name
              - price-asc
            default: name
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Filtered places; stable ID tie-breaker, unknown prices last
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - dataset
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Place"
                  meta:
                    $ref: "#/components/schemas/Pagination"
                  dataset:
                    $ref: "#/components/schemas/Dataset"
        "422":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/places/{id}:
    get:
      operationId: getPlace
      summary: Published place detail; hidden, draft and missing IDs all return 404
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Place and known opening intervals (weekday 0 is Sunday, Vietnam
            local time)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - dataset
                properties:
                  dataset:
                    $ref: "#/components/schemas/Dataset"
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Place"
                      - type: object
                        required:
                          - openingHours
                        properties:
                          openingHours:
                            type: array
                            description: Empty means unknown, never open all day. Closure exceptions are not
                              yet exposed; not a real-time availability
                              guarantee.
                            items:
                              type: object
                              required:
                                - weekday
                                - opensAt
                                - closesAt
                                - crossesMidnight
                              properties:
                                weekday:
                                  type: integer
                                  minimum: 0
                                  maximum: 6
                                opensAt:
                                  type: string
                                closesAt:
                                  type: string
                                crossesMidnight:
                                  type: boolean
        "404":
          description: Place not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/health:
    get:
      operationId: getLiveness
      summary: HTTP process liveness, independent of database availability
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /api/v1/health:
    get:
      operationId: getVersionedLiveness
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /api/ready:
    get:
      operationId: getReadiness
      summary: Check database connectivity; does not verify the complete schema
      responses:
        "200":
          $ref: "#/components/responses/Ready"
        "503":
          $ref: "#/components/responses/NotReady"
  /api/v1/ready:
    get:
      operationId: getVersionedReadiness
      responses:
        "200":
          $ref: "#/components/responses/Ready"
        "503":
          $ref: "#/components/responses/NotReady"
  /api/v1/auth/status:
    get:
      operationId: getAuthStatus
      summary: Whether account features are configured on this server
      responses:
        "200":
          description: Auth capability flag
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - enabled
                    properties:
                      enabled:
                        type: boolean
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Create a TOURIST account without logging in
      parameters:
        - &a1
          name: X-CSRF-Protection
          in: header
          required: true
          schema:
            type: string
            const: "1"
          description: Origin must exactly match the configured browser allowlist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Registration"
      responses:
        "201":
          description: Success; token responses are no-store. Refresh cookie is HttpOnly,
            SameSite=Lax, Path=/api/v1/auth; Secure in production.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredUser"
        "401": &a2
          description: Authentication error; standard code, fields and requestId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": &a3
          description: Authentication error; standard code, fields and requestId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409": &a4
          description: Authentication error; standard code, fields and requestId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422": &a5
          description: Authentication error; standard code, fields and requestId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": &a6
          description: Authentication error; standard code, fields and requestId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": &a7
          description: Authentication error; standard code, fields and requestId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Validate credentials and create a seven-day session
      parameters:
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Success; token responses are no-store. Refresh cookie is HttpOnly,
            SameSite=Lax, Path=/api/v1/auth; Secure in production.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401": *a2
        "403": *a3
        "409": *a4
        "422": *a5
        "429": *a6
        "503": *a7
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the opaque refresh cookie once. Reuse revokes the session.
      parameters:
        - *a1
      responses:
        "200":
          description: Success; token responses are no-store. Refresh cookie is HttpOnly,
            SameSite=Lax, Path=/api/v1/auth; Secure in production.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401": *a2
        "403": *a3
        "409": *a4
        "422": *a5
        "429": *a6
        "503": *a7
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the cookie session even if the access JWT has expired
      parameters:
        - *a1
      responses:
        "204":
          description: Session revoked and cookie cleared; idempotent.
        "401": *a2
        "403": *a3
        "409": *a4
        "422": *a5
        "429": *a6
        "503": *a7
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Issue a 15-minute single-use password reset token with uniform public response
      parameters:
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPassword"
      responses:
        "202":
          description: Uniform public response regardless of whether the email exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponse"
        "403": *a3
        "422": *a5
        "429": *a6
        "503": *a7
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Consume a single-use password reset token, update password and revoke all sessions
      parameters:
        - *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPassword"
      responses:
        "200":
          description: Password updated and all active sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
        "400": *a2
        "403": *a3
        "422": *a5
        "429": *a6
        "503": *a7
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Validate JWT, current DB session, account status and current roles
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user; no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - user
                    properties:
                      user:
                        $ref: "#/components/schemas/AuthUser"
        "401": *a2
        "503": *a7
  /api/v1/me/profile:
    get:
      operationId: getMyProfile
      summary: Get the authenticated tourist profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401": *a2
        "503": *a7
    patch:
      operationId: updateMyProfile
      summary: Update the authenticated tourist display name and phone number
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401": *a2
        "422": *a5
        "503": *a7
  /api/v1/me/preferences:
    get:
      operationId: getMyPreferences
      summary: Get travel preferences and the allowed preference catalog
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Travel preferences and catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
        "401": *a2
        "503": *a7
    put:
      operationId: updateMyPreferences
      summary: Save travel preferences for the authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesUpdate"
      responses:
        "200":
          description: Updated travel preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
        "401": *a2
        "422": *a5
        "503": *a7
  /api/v1/me/consents:
    get:
      operationId: getMyConsents
      summary: Get current consent decisions and history ordered by decision_no DESC
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current decisions and history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentStateResponse"
        "401": *a2
        "503": *a7
    post:
      operationId: recordMyConsent
      summary: Record a sequential consent decision under user row lock
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentDecisionInput"
      responses:
        "201":
          description: Recorded consent decision and updated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentDecisionResponse"
        "401": *a2
        "422": *a5
        "503": *a7
  /api/v1/me/privacy-requests:
    get:
      operationId: listMyPrivacyRequests
      summary: List verified export/delete requests and retention assessment for the current user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Privacy requests and retention summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestListResponse"
        "401": *a2
        "503": *a7
    post:
      operationId: createMyPrivacyRequest
      summary: Submit an export or delete privacy request after password re-verification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequestCreate"
      responses:
        "201":
          description: Verified privacy request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestCreatedResponse"
        "401": *a2
        "409": *a4
        "422": *a5
        "503": *a7
  /api/v1/me/privacy-requests/{id}/export:
    get:
      operationId: downloadMyPrivacyExport
      summary: Download personal data export for a verified request owned by the current user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scoped personal data export package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyExportPackageResponse"
        "401": *a2
        "404": *a2
        "410": *a2
        "422": *a5
        "503": *a7
  /api/v1/places/{id}/audio-guides:
    get:
      operationId: listPlaceAudioGuides
      summary: List published audio guides and transcripts for a place
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Published audio guides for the place
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - dataset
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  dataset:
                    $ref: "#/components/schemas/Dataset"
        "404":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "422":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/events:
    get:
      operationId: listEvents
      summary: List published events in Gia Lai
      responses:
        "200":
          description: Paginated published events
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - dataset
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    type: object
                  dataset:
                    $ref: "#/components/schemas/Dataset"
        "422":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/events/{id}:
    get:
      operationId: getEventDetail
      summary: Get published event details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "422":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/services:
    get:
      operationId: listServices
      summary: List published partner services and available slots
      responses:
        "200":
          description: Paginated published services
          content:
            application/json:
              schema:
                type: object
        "422":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/services/{id}:
    get:
      operationId: getServiceDetail
      summary: Get published service details and slots
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Service details and slots
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "422":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/itinerary-proposals:
    post:
      operationId: proposeItinerary
      summary: Generate smart itinerary proposal from 7 inputs via AI adapter and independent validator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Generated itinerary proposal
          content:
            application/json:
              schema:
                type: object
        "422":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/itinerary-proposals/revalidate:
    post:
      operationId: revalidateItinerary
      summary: Revalidate itinerary days, stops, legs, opening hours and budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Validation result with warnings and violations
          content:
            application/json:
              schema:
                type: object
        "422":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/me/itineraries:
    get:
      operationId: listMyItineraries
      summary: List authenticated user's active itineraries
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of itineraries
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
    post:
      operationId: createMyItinerary
      summary: Save an itinerary with initial revision
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Created itinerary
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "422":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/me/itineraries/{id}:
    get:
      operationId: getMyItineraryDetail
      summary: Get itinerary detail with current revision days, stops and legs
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Itinerary details
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "404":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
    patch:
      operationId: renameMyItinerary
      summary: Rename an itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Renamed itinerary
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "404":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
    delete:
      operationId: deleteMyItinerary
      summary: Soft-delete an itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted itinerary
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "404":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/me/itineraries/{id}/revisions:
    put:
      operationId: updateMyItineraryRevision
      summary: Append new revision with optimistic concurrency check (lock_version)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated itinerary
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "404":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "409":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "422":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/me/itineraries/{id}/copy:
    post:
      operationId: copyMyItinerary
      summary: Deep copy an itinerary into a new itinerary
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Cloned itinerary
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "404":
          $ref: "#/components/responses/InvalidCatalogRequest"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/v1/admin/meta:
    get:
      operationId: getAdminContentMeta
      summary: Get regions, partners, places and media assets for Admin CMS
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Admin CMS metadata
          content:
            application/json:
              schema:
                type: object
        "401": *a2
        "403": *a3
  /api/v1/admin/media-assets:
    post:
      operationId: createAdminMediaAsset
      summary: Validate and register a media asset (image/audio/document)
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Created media asset
          content:
            application/json:
              schema:
                type: object
        "401": *a2
        "403": *a3
        "422": *a5
  /api/v1/admin/contents:
    get:
      operationId: listAdminContents
      summary: List content items and their revision history
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Paginated content items
          content:
            application/json:
              schema:
                type: object
        "401": *a2
        "403": *a3
    post:
      operationId: createAdminContent
      summary: Create a content item and its initial revision
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Created content item
          content:
            application/json:
              schema:
                type: object
        "401": *a2
        "403": *a3
        "422": *a5
  /api/v1/admin/contents/{id}:
    get:
      operationId: getAdminContent
      summary: Get content item and all revisions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Content item detail
          content:
            application/json:
              schema:
                type: object
        "401": *a2
        "403": *a3
        "404": *a2
  /api/v1/admin/contents/{id}/revisions:
    post:
      operationId: createAdminContentRevision
      summary: Create a new immutable revision without altering the published projection
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Updated content item with new revision
          content:
            application/json:
              schema:
                type: object
        "401": *a2
        "403": *a3
        "422": *a5
  /api/v1/admin/contents/{id}/revisions/{revisionId}/submit:
    post:
      operationId: submitAdminContentRevision
      summary: Submit a DRAFT revision to PENDING review queue
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated content item
          content:
            application/json:
              schema:
                type: object
        "401": *a2
        "403": *a3
        "409": *a4
  /api/v1/admin/contents/{id}/revisions/{revisionId}/review:
    post:
      operationId: reviewAdminContentRevision
      summary: Approve (publishing projection atomically) or reject a content revision
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reviewed content item
          content:
            application/json:
              schema:
                type: object
        "401": *a2
        "403": *a3
        "409": *a4
        "422": *a5
  /api/v1/admin/contents/{id}/visibility:
    post:
      operationId: updateAdminContentVisibility
      summary: Change content visibility (PUBLIC, HIDDEN, DRAFT)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated content item visibility
          content:
            application/json:
              schema:
                type: object
        "401": *a2
        "403": *a3
        "409": *a4
  /api/v1/admin/places/{id}/closures:
    post:
      operationId: createAdminPlaceClosure
      summary: Record a verified temporary closure for a place
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Created place closure
          content:
            application/json:
              schema:
                type: object
        "401": *a2
        "403": *a3
        "422": *a5
components:
  responses:
    InvalidCatalogRequest:
      description: Invalid filter or ID; includes field errors and request ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CatalogUnavailable:
      description: Catalog database unavailable; no automatic demo fallback
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Ready:
      description: Database reachable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Readiness"
    NotReady:
      description: Database unreachable or unconfigured; response omits connection details
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Readiness"
  schemas:
    Dataset:
      type: string
      enum:
        - live
        - demo
    Category:
      type: string
      enum:
        - NATURE
        - CULTURE
        - FOOD
        - STAY
        - ADVENTURE
        - OTHER
    Region:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Pagination:
      type: object
      required:
        - page
        - pageSize
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Place:
      type: object
      required:
        - id
        - title
        - description
        - category
        - region
        - latitude
        - longitude
        - referencePriceVnd
        - typicalDurationMinutes
        - sourceReference
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          description: Plain text; never render as HTML
        category:
          $ref: "#/components/schemas/Category"
        region:
          $ref: "#/components/schemas/Region"
        latitude:
          type:
            - number
            - "null"
          minimum: -90
          maximum: 90
        longitude:
          type:
            - number
            - "null"
          minimum: -180
          maximum: 180
        referencePriceVnd:
          type:
            - string
            - "null"
          pattern: ^(0|[1-9][0-9]*)$
        typicalDurationMinutes:
          type:
            - integer
            - "null"
          minimum: 1
        sourceReference:
          type:
            - string
            - "null"
          description: Source text or HTTP URL; demo values are null
        updatedAt:
          type: string
          format: date-time
    Liveness:
      type: object
      required:
        - status
        - service
      properties:
        status:
          const: ok
        service:
          const: gialai-travel-api
    Readiness:
      type: object
      required:
        - status
        - service
        - checks
      properties:
        status:
          enum:
            - ready
            - not_ready
        service:
          const: gialai-travel-api
        checks:
          type: object
          required:
            - database
          properties:
            database:
              enum:
                - up
                - down
        requestId:
          type: string
          format: uuid
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
              format: uuid
            fields:
              type: array
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
    AuthUser:
      type: object
      required:
        - id
        - email
        - displayName
        - roles
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
              - TOURIST
              - ADMIN
              - PARTNER
              - CONTRIBUTOR
              - B2G
    Login:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    Registration:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - displayName
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 150
    RegisteredUser:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - email
            - displayName
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            displayName:
              type: string
    AuthSession:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - accessToken
            - tokenType
            - expiresIn
            - user
          properties:
            accessToken:
              type: string
              description: Memory-only bearer token; never persist in browser storage.
            tokenType:
              const: Bearer
            expiresIn:
              type: integer
              minimum: 1
              maximum: 900
            user:
              $ref: "#/components/schemas/AuthUser"
    ForgotPassword:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ForgotPasswordResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - accepted
            - message
          properties:
            accepted:
              const: true
            message:
              type: string
    ResetPassword:
      type: object
      additionalProperties: false
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 12
          maxLength: 128
    ResetPasswordResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - message
          properties:
            message:
              type: string
    UserProfile:
      type: object
      required:
        - id
        - email
        - displayName
        - phone
        - roles
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        phone:
          type:
            - string
            - "null"
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserProfileUpdate:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type:
            - string
            - "null"
          maxLength: 32
    UserProfileResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/UserProfile"
    UserPreferences:
      type: object
      required:
        - categories
        - pace
        - travelGroup
        - dietaryNotes
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        pace:
          type: string
          enum:
            - RELAXED
            - BALANCED
            - INTENSIVE
        travelGroup:
          type: string
          enum:
            - SOLO
            - COUPLE
            - FAMILY
            - FRIENDS
        dietaryNotes:
          type:
            - string
            - "null"
    UserPreferencesUpdate:
      $ref: "#/components/schemas/UserPreferences"
    UserPreferencesResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - preferences
            - catalog
          properties:
            preferences:
              $ref: "#/components/schemas/UserPreferences"
            catalog:
              type: object
    ConsentPurpose:
      type: string
      enum:
        - PERSONALIZATION
        - ADVERTISING
    ConsentDecision:
      type: object
      required:
        - id
        - purpose
        - decisionNo
        - granted
        - policyVersion
        - decidedAt
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: "#/components/schemas/ConsentPurpose"
        decisionNo:
          type: integer
          minimum: 1
        granted:
          type: boolean
        policyVersion:
          type: string
        decidedAt:
          type: string
          format: date-time
    ConsentCurrentItem:
      type: object
      required:
        - purpose
        - title
        - description
        - policyVersion
        - decisionNo
        - granted
        - decidedAt
      properties:
        purpose:
          $ref: "#/components/schemas/ConsentPurpose"
        title:
          type: string
        description:
          type: string
        policyVersion:
          type: string
        decisionNo:
          type: integer
          minimum: 0
        granted:
          type: boolean
        decidedAt:
          type:
            - string
            - "null"
          format: date-time
    ConsentDecisionInput:
      type: object
      additionalProperties: false
      required:
        - purpose
        - granted
      properties:
        purpose:
          $ref: "#/components/schemas/ConsentPurpose"
        granted:
          type: boolean
    ConsentStateResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - current
            - history
          properties:
            current:
              type: array
              items:
                $ref: "#/components/schemas/ConsentCurrentItem"
            history:
              type: array
              items:
                $ref: "#/components/schemas/ConsentDecision"
    ConsentDecisionResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - decision
            - current
            - history
          properties:
            decision:
              $ref: "#/components/schemas/ConsentDecision"
            current:
              type: array
              items:
                $ref: "#/components/schemas/ConsentCurrentItem"
            history:
              type: array
              items:
                $ref: "#/components/schemas/ConsentDecision"
    PrivacyRequestItem:
      type: object
      required:
        - id
        - requestType
        - status
        - verifiedAt
        - completedAt
        - slaDueAt
        - resultNote
        - downloadPath
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        requestType:
          type: string
          enum:
            - EXPORT
            - DELETE
        status:
          type: string
          enum:
            - NEW
            - VERIFIED
            - PROCESSING
            - COMPLETED
            - REJECTED
        verifiedAt:
          type:
            - string
            - "null"
          format: date-time
        completedAt:
          type:
            - string
            - "null"
          format: date-time
        slaDueAt:
          type:
            - string
            - "null"
          format: date-time
        resultNote:
          type:
            - string
            - "null"
        downloadPath:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
    PrivacyRetentionSummary:
      type: object
      required:
        - activeBookingsCount
        - historicalBookingsCount
        - slaDays
        - policyNote
      properties:
        activeBookingsCount:
          type: integer
          minimum: 0
        historicalBookingsCount:
          type: integer
          minimum: 0
        slaDays:
          type: integer
          minimum: 1
        policyNote:
          type: string
    PrivacyRequestCreate:
      type: object
      additionalProperties: false
      required:
        - requestType
        - password
      properties:
        requestType:
          type: string
          enum:
            - EXPORT
            - DELETE
        password:
          type: string
          minLength: 1
          maxLength: 128
    PrivacyRequestListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - requests
            - retentionSummary
          properties:
            requests:
              type: array
              items:
                $ref: "#/components/schemas/PrivacyRequestItem"
            retentionSummary:
              $ref: "#/components/schemas/PrivacyRetentionSummary"
    PrivacyRequestCreatedResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - request
            - retentionSummary
          properties:
            request:
              $ref: "#/components/schemas/PrivacyRequestItem"
            retentionSummary:
              $ref: "#/components/schemas/PrivacyRetentionSummary"
    PrivacyExportPackageResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - requestId
            - exportedAt
            - expiresAt
            - subject
            - consents
            - itineraries
            - bookings
            - issueReports
            - privacyRequests
          properties:
            requestId:
              type: string
              format: uuid
            exportedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
            subject:
              type: object
            consents:
              type: array
              items:
                $ref: "#/components/schemas/ConsentDecision"
            itineraries:
              type: array
              items:
                type: object
            bookings:
              type: array
              items:
                type: object
            issueReports:
              type: array
              items:
                type: object
            privacyRequests:
              type: array
              items:
                $ref: "#/components/schemas/PrivacyRequestItem"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT RS256 (typ=at+jwt)
